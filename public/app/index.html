<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinculación de terceros – Inversora Arcilaza S.A.S.</title>
  <link rel="icon" href="/shared/logo-cofinet.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
  <link rel="stylesheet" href="/shared/estilos.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="form-login" class="login-caja">
      <div class="logo-pastilla"><img src="/shared/logo-cofinet.png" alt="Cofinet"></div>
      <h1>Vinculación de terceros</h1>
      <div class="sub">Inversora Arcilaza S.A.S. · Contabilidad</div>
      <div id="login-error"></div>
      <div class="campo"><label for="l-usuario">Usuario</label><input id="l-usuario" name="usuario" autocomplete="username" required></div>
      <div class="campo"><label for="l-password">Contraseña</label><input id="l-password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="lateral" id="lateral">
      <div>
        <div class="lateral-marca">
          <div class="logo-pastilla"><img src="/shared/logo-cofinet.png" alt="Cofinet"></div>
          <div>Vinculación de terceros<br>Inversora Arcilaza S.A.S.</div>
        </div>
        <nav class="nav" id="nav">
          <a href="#/bandeja" data-ruta="bandeja">Bandeja de revisión <span class="cuenta" data-cuenta="pendientes"></span></a>
          <a href="#/categoria/proveedor" data-ruta="categoria/proveedor">Proveedores</a>
          <a href="#/categoria/cliente" data-ruta="categoria/cliente">Clientes</a>
          <a href="#/categoria/contratista" data-ruta="categoria/contratista">Contratistas</a>
          <a href="#/categoria/empleado" data-ruta="categoria/empleado">Empleados</a>
          <a href="#/categoria/otro" data-ruta="categoria/otro" id="nav-otros" hidden>Otros</a>
          <div class="nav-division"></div>
          <a href="#/por-actualizar" data-ruta="por-actualizar">Por actualizar <span class="cuenta" data-cuenta="por_actualizar"></span></a>
          <a href="#/reportes" data-ruta="reportes">Reportes</a>
          <a href="#/usuarios" data-ruta="usuarios" data-solo-admin hidden>Usuarios</a>
          <a href="/formulario/" target="_blank" rel="noopener">Portal público ↗</a>
        </nav>
      </div>
      <div class="usuario">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="usuario-nombre" id="usuario-nombre"></div>
          <div class="usuario-rol"><span id="usuario-rol"></span> · <a href="#/cuenta">Cuenta</a> · <button id="btn-salir" type="button">Salir</button></div>
        </div>
      </div>
    </aside>
    <div class="principal" id="vista"></div>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="aviso" class="aviso" hidden role="status"></div>

  <script src="/shared/campos.js"></script>
  <script src="/shared/archivos.js"></script>
  <script src="app.js"></script>
</body>
</html>
